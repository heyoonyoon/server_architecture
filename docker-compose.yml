name: sa

x-server: &server
  build:
    context: .
    dockerfile: Server/Dockerfile
  image: sa-server:latest
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/serverarchitecture
    DB_USER: serverarchitecture
    DB_PASSWORD: serverarchitecture
  expose:
    - "8081"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: serverarchitecture
      POSTGRES_USER: serverarchitecture
      POSTGRES_PASSWORD: serverarchitecture
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serverarchitecture -d serverarchitecture"]
      interval: 5s
      timeout: 5s
      retries: 10

  server1:
    <<: *server
    hostname: server1
    volumes:
      - ./logs/server1:/app/logs

  server2:
    <<: *server
    hostname: server2
    volumes:
      - ./logs/server2:/app/logs

  envoy:
    build:
      context: .
      dockerfile: deploy/envoy/Dockerfile
    image: sa-envoy:latest
    volumes:
      - ./deploy/allinone/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"
      - "9901:9901"
    depends_on:
      - server1
      - server2

  nginx:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: sa-web:latest
    volumes:
      - ./deploy/lb/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - envoy

volumes:
  pgdata:
