plugins {
    id 'java'
    id 'application'
}

group = 'com.serverarchitecture'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':Proto')
    implementation project(':Common')
    implementation 'io.grpc:grpc-protobuf:1.75.0'
    implementation 'io.grpc:grpc-stub:1.75.0'
    implementation 'com.google.protobuf:protobuf-java:3.25.8'
    runtimeOnly 'io.grpc:grpc-netty-shaded:1.75.0'
    implementation 'org.apache.kafka:kafka-clients:4.4.0'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.grpc:grpc-inprocess:1.75.0'
}

application {
    mainClass = 'com.serverarchitecture.enrollment.EnrollmentServer'
}

test {
    useJUnitPlatform()
}

def extraStartScripts = [
        authServerStartScripts        : ['AuthServer', 'com.serverarchitecture.auth.AuthServer'],
        enrollmentServerStartScripts  : ['EnrollmentServer', 'com.serverarchitecture.enrollment.EnrollmentServer'],
        academicServerStartScripts    : ['AcademicServer', 'com.serverarchitecture.academic.AcademicServer'],
        queueWorkerStartScripts       : ['QueueWorker', 'com.serverarchitecture.enrollment.QueueWorker'],
        enrollmentConsumerStartScripts: ['EnrollmentConsumer', 'com.serverarchitecture.enrollment.EnrollmentConsumer']
]

extraStartScripts.each { taskName, script ->
    def task = tasks.register(taskName, CreateStartScripts) {
        applicationName = script[0]
        mainClass = script[1]
        classpath = tasks.named('startScripts').get().classpath
        outputDir = layout.buildDirectory.dir("startScripts/${script[0]}").get().asFile
    }
    distributions.main.contents {
        from(task) {
            into 'bin'
            filePermissions {
                unix('rwxr-xr-x')
            }
        }
    }
}
