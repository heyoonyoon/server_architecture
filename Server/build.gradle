plugins {
    id 'java'
    id 'application'
}

group = 'com.serverarchitecture'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':Proto')
    implementation 'io.grpc:grpc-protobuf:1.75.0'
    implementation 'io.grpc:grpc-stub:1.75.0'
    implementation 'com.google.protobuf:protobuf-java:3.25.8'
    runtimeOnly 'io.grpc:grpc-netty-shaded:1.75.0'
    implementation 'org.postgresql:postgresql:42.7.14'
    implementation 'com.zaxxer:HikariCP:7.1.0'
    implementation 'org.flywaydb:flyway-core:13.10.0'
    implementation 'org.flywaydb:flyway-database-postgresql:13.10.0'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'at.favre.lib:bcrypt:0.10.2'
    implementation 'redis.clients:jedis:7.5.3'
    implementation 'org.apache.kafka:kafka-clients:4.4.0'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.serverarchitecture.Server'
}

test {
    useJUnitPlatform()
}

def extraStartScripts = [
        queueWorkerStartScripts       : ['QueueWorker', 'com.serverarchitecture.QueueWorker'],
        enrollmentConsumerStartScripts: ['EnrollmentConsumer', 'com.serverarchitecture.EnrollmentConsumer']
]

extraStartScripts.each { taskName, script ->
    def task = tasks.register(taskName, CreateStartScripts) {
        applicationName = script[0]
        mainClass = script[1]
        classpath = tasks.named('startScripts').get().classpath
        outputDir = layout.buildDirectory.dir("startScripts/${script[0]}").get().asFile
    }
    distributions.main.contents {
        from(task) {
            into 'bin'
            filePermissions {
                unix('rwxr-xr-x')
            }
        }
    }
}
