name: sa-infra

x-enrollment-process: &enrollment-process
  build:
    context: ../..
    dockerfile: Server/Dockerfile
  image: sa-server:latest
  environment:
    DATA_HOST: ${DATA_HOST:-192.168.64.33}
    DATA_PORT: ${DATA_PORT:-9200}
    DATA_DEADLINE_MS: ${DATA_DEADLINE_MS:-3000}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    KAFKA_BOOTSTRAP: kafka:9092
    SEMESTER: ${SEMESTER:-2026-2}
    QUEUE_MAX_ACTIVE: ${QUEUE_MAX_ACTIVE:-50}
    PASS_TTL_SECONDS: ${PASS_TTL_SECONDS:-300}
    PASS_CLAIM_SECONDS: ${PASS_CLAIM_SECONDS:-30}
    WAITER_TIMEOUT_SECONDS: ${WAITER_TIMEOUT_SECONDS:-30}
    WORKER_TICK_MS: ${WORKER_TICK_MS:-500}
    REDIS_POOL_MAX: ${REDIS_POOL_MAX:-8}
    REDIS_POOL_MIN_IDLE: ${REDIS_POOL_MIN_IDLE:-1}
    REDIS_POOL_MAX_WAIT_MS: ${REDIS_POOL_MAX_WAIT_MS:-2000}
    SEED_LOADTEST: ${SEED_LOADTEST:-true}
    JAVA_OPTS: -Xms${WORKER_HEAP:-192m} -Xmx${WORKER_HEAP:-192m}
  cpus: ${WORKER_CPUS:-1}
  mem_limit: ${WORKER_MEM:-384m}
  restart: unless-stopped

services:
  redis:
    image: redis:8.10.2
    command: ["redis-server", "--appendonly", "yes"]
    cpus: ${REDIS_CPUS:-1}
    mem_limit: ${REDIS_MEM:-256m}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-USdYYW1FSfiaK-7EKPip0g}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${INFRA_HOST:-192.168.64.34}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms${KAFKA_HEAP:-512m} -Xmx${KAFKA_HEAP:-512m}
    cpus: ${KAFKA_CPUS:-1}
    mem_limit: ${KAFKA_MEM:-1g}
    ports:
      - "9092:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 20s
      start_period: 20s
      retries: 12
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic enrollment-events --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic enrollment-events-dlt --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe
        --topic 'enrollment-events.*'
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  queue-worker:
    <<: *enrollment-process
    hostname: queue-worker
    entrypoint: ["/app/bin/QueueWorker"]
    volumes:
      - ./logs/queue-worker:/app/logs
    depends_on:
      redis:
        condition: service_healthy

  enrollment-consumer:
    <<: *enrollment-process
    hostname: enrollment-consumer
    entrypoint: ["/app/bin/EnrollmentConsumer"]
    volumes:
      - ./logs/enrollment-consumer:/app/logs
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/course-registration.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
