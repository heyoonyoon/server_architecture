name: sa-app

services:
  server:
    build:
      context: ../..
      dockerfile: Server/Dockerfile
    image: sa-server:latest
    hostname: ${SERVER_NAME:-sa-app}
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST:-192.168.64.33}:${DB_PORT:-5432}/${DB_NAME:-serverarchitecture}
      DB_USER: ${DB_USER:-serverarchitecture}
      DB_PASSWORD: ${DB_PASSWORD:-serverarchitecture}
      JWT_SECRET: ${JWT_SECRET:-serverarchitecture-dev-jwt-secret-change-me}
      REDIS_HOST: ${REDIS_HOST:-192.168.64.34}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-192.168.64.34:9092}
      SEMESTER: ${SEMESTER:-2026-2}
      QUEUE_MAX_ACTIVE: ${QUEUE_MAX_ACTIVE:-50}
      PASS_TTL_SECONDS: ${PASS_TTL_SECONDS:-300}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      DB_POOL_MAX: ${DB_POOL_MAX:-30}
      DB_POOL_TIMEOUT_MS: ${DB_POOL_TIMEOUT_MS:-3000}
      REDIS_POOL_MAX: ${REDIS_POOL_MAX:-128}
      REDIS_POOL_MIN_IDLE: ${REDIS_POOL_MIN_IDLE:-8}
      REDIS_POOL_MAX_WAIT_MS: ${REDIS_POOL_MAX_WAIT_MS:-2000}
      CATALOG_REFRESH_SECONDS: ${CATALOG_REFRESH_SECONDS:-60}
    volumes:
      - ./logs:/app/logs
    ports:
      - "8081:8081"
    restart: unless-stopped
