name: sa-app

services:
  server:
    build:
      context: ../..
      dockerfile: Server/Dockerfile
    image: sa-server:latest
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST:-192.168.64.33}:${DB_PORT:-5432}/${DB_NAME:-serverarchitecture}
      DB_USER: ${DB_USER:-serverarchitecture}
      DB_PASSWORD: ${DB_PASSWORD:-serverarchitecture}
    ports:
      - "8081:8081"
    restart: unless-stopped
