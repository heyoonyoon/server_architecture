name: sa-db

services:
  data:
    build:
      context: ../..
      dockerfile: Data/Dockerfile
    image: sa-data:latest
    hostname: ${SERVER_NAME:-sa-db}
    environment:
      DATA_PORT: 9200
      DATA_FSYNC: ${DATA_FSYNC:-always}
    ports:
      - "9200:9200"
    volumes:
      - data-store:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9200"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 20
    restart: unless-stopped

volumes:
  data-store:
