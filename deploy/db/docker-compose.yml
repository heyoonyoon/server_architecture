name: sa-db

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serverarchitecture}
      POSTGRES_USER: ${POSTGRES_USER:-serverarchitecture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serverarchitecture}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-serverarchitecture}:${POSTGRES_PASSWORD:-serverarchitecture}@postgres:5432/${POSTGRES_DB:-serverarchitecture}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
