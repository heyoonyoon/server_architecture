name: sa-lb

services:
  envoy:
    build:
      context: ../..
      dockerfile: deploy/envoy/Dockerfile
    image: sa-envoy:latest
    cpus: ${ENVOY_CPUS:-1}
    mem_limit: ${ENVOY_MEM:-512m}
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"
      - "9901:9901"
    restart: unless-stopped
