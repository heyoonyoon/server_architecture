admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                stream_idle_timeout: 300s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: grpc_service
                      domains: ["*"]
                      routes:
                        - match:
                            path: /serverarchitecture.EnrollmentService/WatchQueue
                          route:
                            cluster: enrollment
                            timeout: 0s
                            idle_timeout: 300s
                        - match:
                            prefix: /serverarchitecture.AuthService/
                          route:
                            cluster: auth
                            timeout: 30s
                            max_stream_duration:
                              grpc_timeout_header_max: 30s
                            retry_policy:
                              retry_on: connect-failure,refused-stream
                              num_retries: 2
                        - match:
                            prefix: /serverarchitecture.AcademicService/
                          route:
                            cluster: academic
                            timeout: 5s
                            max_stream_duration:
                              grpc_timeout_header_max: 5s
                            retry_policy:
                              retry_on: connect-failure,refused-stream
                              num_retries: 2
                        - match:
                            prefix: /serverarchitecture.EnrollmentService/
                          route:
                            cluster: enrollment
                            timeout: 5s
                            max_stream_duration:
                              grpc_timeout_header_max: 5s
                            retry_policy:
                              retry_on: connect-failure,refused-stream
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.grpc_stats
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_stats.v3.FilterConfig
                      stats_for_all_methods: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: auth
      type: STATIC
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 10000
            max_pending_requests: 10000
            max_requests: 10000
            max_retries: 3
          - priority: HIGH
            max_connections: 10000
            max_pending_requests: 10000
            max_requests: 10000
            max_retries: 3
        per_host_thresholds:
          - priority: DEFAULT
            max_connections: 1
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options:
              max_concurrent_streams: 16
      outlier_detection:
        consecutive_5xx: 5
        consecutive_gateway_failure: 3
        interval: 5s
        base_ejection_time: 30s
        max_ejection_percent: 50
      health_checks:
        - timeout: 1s
          interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 1
          tcp_health_check: {}
      load_assignment:
        cluster_name: auth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 192.168.64.34
                      port_value: 9101
    - name: academic
      type: STATIC
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 10000
            max_pending_requests: 10000
            max_requests: 10000
            max_retries: 3
          - priority: HIGH
            max_connections: 10000
            max_pending_requests: 10000
            max_requests: 10000
            max_retries: 3
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      outlier_detection:
        consecutive_5xx: 5
        consecutive_gateway_failure: 3
        interval: 5s
        base_ejection_time: 30s
        max_ejection_percent: 50
      health_checks:
        - timeout: 1s
          interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 1
          tcp_health_check: {}
      load_assignment:
        cluster_name: academic
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 192.168.64.34
                      port_value: 9102
    - name: enrollment
      type: STATIC
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 10000
            max_pending_requests: 10000
            max_requests: 10000
            max_retries: 3
          - priority: HIGH
            max_connections: 10000
            max_pending_requests: 10000
            max_requests: 10000
            max_retries: 3
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      outlier_detection:
        consecutive_5xx: 5
        consecutive_gateway_failure: 3
        interval: 5s
        base_ejection_time: 30s
        max_ejection_percent: 50
      health_checks:
        - timeout: 1s
          interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 1
          tcp_health_check: {}
      load_assignment:
        cluster_name: enrollment
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
