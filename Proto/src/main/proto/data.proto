syntax = "proto3";

package serverarchitecture.data;

option java_multiple_files = true;
option java_package = "com.serverarchitecture.data.api";

message Item {
  string id = 1;
  map<string, string> fields = 2;
}

message CreateRequest {
  string collection = 1;
  Item item = 2;
}

message ReadRequest {
  string collection = 1;
  string id = 2;
}

message ReadResponse {
  bool found = 1;
  Item item = 2;
}

message ReadAllRequest {
  string collection = 1;
}

message ReadWhereRequest {
  string collection = 1;
  string field = 2;
  string value = 3;
}

message ItemList {
  repeated Item items = 1;
}

message UpdateRequest {
  string collection = 1;
  Item item = 2;
  map<string, string> expected = 3;
}

message UpsertRequest {
  string collection = 1;
  Item item = 2;
  map<string, string> expected = 3;
}

enum UpsertOutcome {
  UPSERT_OUTCOME_UNSPECIFIED = 0;
  CREATED = 1;
  UPDATED = 2;
  UNCHANGED = 3;
}

message UpsertResponse {
  UpsertOutcome outcome = 1;
  Item item = 2;
}

message DeleteRequest {
  string collection = 1;
  string id = 2;
}

message DeleteResponse {
  bool deleted = 1;
}

message CountRequest {
  string collection = 1;
}

message CountResponse {
  int64 count = 1;
}

service DataService {
  rpc Create(CreateRequest) returns (Item);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc ReadAll(ReadAllRequest) returns (ItemList);
  rpc ReadWhere(ReadWhereRequest) returns (ItemList);
  rpc Update(UpdateRequest) returns (Item);
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Count(CountRequest) returns (CountResponse);
}
