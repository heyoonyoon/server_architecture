syntax = "proto3";

package serverarchitecture;

option java_multiple_files = true;
option java_package = "com.serverarchitecture";

import "common.proto";

enum QueueState {
  QUEUE_STATE_UNSPECIFIED = 0;
  NOT_IN_QUEUE = 1;
  WAITING = 2;
  ADMITTED = 3;
}

message EnterQueueRequest {}

message GetQueueStatusRequest {}

message WatchQueueRequest {}

message QueueStatusResponse {
  QueueState state = 1;
  int32 position = 2;
  int32 next_poll_ms = 3;
  int32 pass_remaining_seconds = 4;
}

message LeaveQueueRequest {}

message LeaveQueueResponse {
  bool released = 1;
}

message GetScheduleRequest {}

message GetScheduleResponse {
  int64 open_at_ms = 1;
  int64 server_now_ms = 2;
}

message ListOfferingsRequest {}

message ListOfferingsResponse {
  repeated OfferingInfo offerings = 1;
}

message EnrollRequest {
  int32 offering_id = 1;
}

message EnrollResponse {
  string message = 1;
  OfferingInfo offering = 2;
}

message CancelEnrollmentRequest {
  int32 offering_id = 1;
}

message CancelEnrollmentResponse {
  string message = 1;
  int32 offering_id = 2;
}

message ListMyEnrollmentsRequest {}

message ListMyEnrollmentsResponse {
  repeated OfferingInfo offerings = 1;
  int32 total_credits = 2;
  int32 max_credits = 3;
}

enum EnrollmentEventType {
  ENROLLMENT_EVENT_TYPE_UNSPECIFIED = 0;
  ENROLLED = 1;
  CANCELLED = 2;
}

message EnrollmentEvent {
  string event_id = 1;
  EnrollmentEventType type = 2;
  string student_id = 3;
  int32 offering_id = 4;
  string semester = 5;
  int64 occurred_at_ms = 6;
}

service EnrollmentService {
  rpc EnterQueue(EnterQueueRequest) returns (QueueStatusResponse);
  rpc GetQueueStatus(GetQueueStatusRequest) returns (QueueStatusResponse);
  rpc WatchQueue(WatchQueueRequest) returns (stream QueueStatusResponse);
  rpc LeaveQueue(LeaveQueueRequest) returns (LeaveQueueResponse);
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);
  rpc ListOfferings(ListOfferingsRequest) returns (ListOfferingsResponse);
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc CancelEnrollment(CancelEnrollmentRequest) returns (CancelEnrollmentResponse);
  rpc ListMyEnrollments(ListMyEnrollmentsRequest) returns (ListMyEnrollmentsResponse);
}
