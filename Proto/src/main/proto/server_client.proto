syntax = "proto3";

package serverarchitecture;

option java_multiple_files = true;
option java_package = "com.serverarchitecture";

message StudentInfo {
  string student_id = 1;
  string name = 2;
  string department = 3;
  repeated string completed_course_ids = 4;
}

message CourseInfo {
  string course_id = 1;
  string course_name = 2;
  string instructor_name = 3;
  repeated string prerequisite_course_ids = 4;
}

message EnrollmentInfo {
  string student_id = 1;
  string course_id = 2;
}

message GetStudentListControllerRequest {
  string student_id = 1;
}

message GetStudentListControllerResponse {
  bool success = 1;
  repeated StudentInfo students = 2;
}

// -----------------------------------------

message GetCourseListControllerRequest {}

message GetCourseListControllerResponse {
  bool success = 1;
  repeated CourseInfo courses = 2;
}

// -----------------------------------------

message GetEnrolledCoursesByStudentIdControllerRequest {
  string student_id = 1;
}

message GetEnrolledCoursesByStudentIdControllerResponse {
  bool success = 1;
  repeated CourseInfo courses = 2;
}

// -----------------------------------------

message GetEnrolledStudentsByCourseIdControllerRequest {
  string course_id = 1;
}

message GetEnrolledStudentsByCourseIdControllerResponse {
  bool success = 1;
  repeated StudentInfo students = 2;
}

// -----------------------------------------

message GetCompletedCoursesByStudentIdControllerRequest {
  string student_id = 1;
}

message GetCompletedCoursesByStudentIdControllerResponse {
  bool success = 1;
  repeated CourseInfo courses = 2;
}

// -----------------------------------------

message EnrollCourseControllerRequest {
  string student_id = 1;
  string course_id = 2;
}

message EnrollCourseControllerResponse {
  bool success = 1;
  EnrollmentInfo enrollment = 2;
}

// -----------------------------------------

message AddStudentControllerRequest {
  StudentInfo student = 1;
}

message AddStudentControllerResponse {
  bool success = 1;
}

// -----------------------------------------

message DeleteStudentControllerRequest {
  string student_id = 1;
}

message DeleteStudentControllerResponse {
  bool success = 1;
}

// -----------------------------------------

message AddCourseControllerRequest {
  CourseInfo course = 1;
}

message AddCourseControllerResponse {
  bool success = 1;
}

// -----------------------------------------

message DeleteCourseControllerRequest {
  string course_id = 1;
}

message DeleteCourseControllerResponse {
  bool success = 1;
}

// -----------------------------------------

enum Role {
  ROLE_UNSPECIFIED = 0;
  STUDENT = 1;
  PROFESSOR = 2;
}

message LoginControllerRequest {
  string user_id = 1;
  string password = 2;
}

message LoginControllerResponse {
  bool success = 1;
  string token = 2;
  string user_id = 3;
  string name = 4;
  Role role = 5;
}

// -----------------------------------------

service ServerClientService {
  rpc GetStudentListController(GetStudentListControllerRequest)
      returns (GetStudentListControllerResponse);

  rpc GetCourseListController(GetCourseListControllerRequest)
      returns (GetCourseListControllerResponse);

  rpc GetEnrolledCoursesByStudentIdController(GetEnrolledCoursesByStudentIdControllerRequest)
      returns (GetEnrolledCoursesByStudentIdControllerResponse);

  rpc GetEnrolledStudentsByCourseIdController(GetEnrolledStudentsByCourseIdControllerRequest)
      returns (GetEnrolledStudentsByCourseIdControllerResponse);

  rpc GetCompletedCoursesByStudentIdController(GetCompletedCoursesByStudentIdControllerRequest)
      returns (GetCompletedCoursesByStudentIdControllerResponse);

  rpc EnrollCourseController(EnrollCourseControllerRequest)
      returns (EnrollCourseControllerResponse);

  rpc AddStudentController(AddStudentControllerRequest)
      returns (AddStudentControllerResponse);

  rpc DeleteStudentController(DeleteStudentControllerRequest)
      returns (DeleteStudentControllerResponse);

  rpc AddCourseController(AddCourseControllerRequest)
      returns (AddCourseControllerResponse);

  rpc DeleteCourseController(DeleteCourseControllerRequest)
      returns (DeleteCourseControllerResponse);

  rpc LoginController(LoginControllerRequest)
      returns (LoginControllerResponse);

}
